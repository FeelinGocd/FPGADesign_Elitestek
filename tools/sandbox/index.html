<style>
:root{--bg:#0c1118;--panel:#151d28;--panel2:#1b2735;--line:#2b3a4c;--text:#e6edf5;--muted:#91a1b5;--blue:#59a9ff;--orange:#f4aa62}*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.45 "Segoe UI","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{border:1px solid var(--line);border-radius:6px;background:#223043;color:var(--text);padding:6px 10px;cursor:pointer}button:hover{border-color:var(--blue);background:#29415d}button.primary{background:#18548b;border-color:#347dbb}.app{display:grid;grid-template-columns:252px minmax(520px,1fr) 248px;grid-template-rows:58px 1fr;height:100%}header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:#101923}header h1{margin:0;font-size:17px;letter-spacing:.5px}header .sub{color:var(--muted)}header .spacer{flex:1}.panel{min-height:0;overflow:auto;padding:14px;background:var(--panel)}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.section{margin-bottom:18px}.section h2{margin:0 0 9px;color:#b8c7d9;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.palette{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.tile{min-height:78px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid var(--line);border-radius:8px;background:#0e151e;cursor:pointer;overflow:hidden}.tile:hover{border-color:#6588ac}.tile.selected{border-color:var(--blue);box-shadow:0 0 0 2px #59a9ff33 inset}.tile img{width:42px;height:42px;object-fit:contain;image-rendering:pixelated}.tile .code{position:absolute;top:4px;left:5px;color:var(--orange);font:700 11px Consolas,monospace}.tile .name{color:#cbd7e4;font-size:12px}.preview{display:flex;align-items:center;gap:10px}#preview{width:96px;height:96px;border:1px solid var(--line);border-radius:8px;background:#0b121b;image-rendering:pixelated}#previewText{color:var(--muted);font-size:12px;white-space:pre-line}.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;color:var(--muted)}kbd{padding:1px 5px;border:1px solid #506176;border-radius:4px;color:#dce8f4;background:#202d3d;font:11px Consolas,monospace}.canvas-wrap{min-width:0;min-height:0;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:24px;background:radial-gradient(circle at center,#182535,#0b1118 72%)}#map{display:block;background:#090e14;border:1px solid #5b7189;box-shadow:0 10px 38px #0009;image-rendering:pixelated;cursor:crosshair}.info{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--muted)}.info strong{color:var(--text)}.counts{display:grid;grid-template-columns:1fr 1fr;gap:6px}.count{padding:7px 8px;border-radius:6px;background:#101923;color:var(--muted)}.count b{float:right;color:var(--text);font-family:Consolas,monospace}input,textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:#0d151f;color:var(--text);padding:7px 8px}textarea{min-height:132px;resize:vertical;font:12px/1.35 Consolas,monospace}.row{display:flex;gap:6px;align-items:center}.row>*{flex:1}.status{min-height:20px;color:var(--muted);font-size:12px}.status.ok{color:#91d4a6}.status.err{color:#ff9d9d}@media(max-width:1050px){.app{grid-template-columns:220px minmax(420px,1fr)}.right{display:none}}

<body><div class="app">
<header><h1>DEBUG · 房间编辑器</h1><span class="sub">40 × 23 网格 · 1280 × 720 · 32 px / 格</span><span class="spacer"></span><button onclick="zoomFit()">适应窗口</button><button onclick="setZoom(1)">100%</button><button onclick="setZoom(1.5)">150%</button><span id="zoomReadout" class="sub">100%</span></header>
<aside class="panel left"><div class="section"><h2>素材笔刷</h2><div id="palette" class="palette"></div></div><div class="section"><h2>当前预览</h2><div class="preview"><canvas id="preview" width="96" height="96"></canvas><div id="previewText"></div></div></div><div class="section"><h2>操作</h2><div class="keys"><kbd>左键</kbd><span>绘制</span><kbd>右键</kbd><span>擦除</span><kbd>R</kbd><span>角落方向循环</span><kbd>1–4</kbd><span>角落方向</span><kbd>B/W/D/E</kbd><span>地板 / 墙 / 门 / 空白</span><kbd>Ctrl+Z</kbd><span>撤销</span><kbd>0</kbd><span>适应窗口</span></div></div><div class="section"><h2>地图操作</h2><div class="row"><button class="primary" onclick="newMap()">清空地图</button><button onclick="undo()">撤销</button></div></div></aside>
<main class="canvas-wrap" id="canvasWrap"><canvas id="map" width="1280" height="720"></canvas></main>
<aside class="panel right"><div class="section"><h2>房间约束</h2><div class="info"><strong>导出格式</strong><br><code>23 行 × 40 字符</code><br><br><strong>字符含义</strong><br><code>.</code> 空白　<code>B</code> 地板<br><code>W</code> 墙　<code>D</code> 门（占 1×2）<br><code>C/X/Y/Z</code> 角落四方向</div></div><div class="section"><h2>当前统计</h2><div id="counts" class="counts"></div></div><div class="section"><h2>保存到 output</h2><input id="fileName" value="room_map.txt"><div class="row" style="margin-top:7px"><button class="primary" onclick="saveOutput()">保存</button><button onclick="loadOutput()">读取</button></div><button style="width:100%;margin-top:7px" onclick="listOutput()">列出已有地图</button><div id="status" class="status">需要通过 serve.py 打开页面才能访问 output。</div></div><div class="section"><h2>导出 / 导入文本</h2><textarea id="mapText" readonly></textarea><div class="row" style="margin-top:7px"><button onclick="copyMap()">复制</button><button onclick="downloadMap()">下载</button></div><textarea id="importText" style="margin-top:7px" placeholder="粘贴 23 行、每行 40 字符的地图文本"></textarea><button style="width:100%;margin-top:7px" onclick="importMap()">导入文本</button></div></aside>
</div>
<script>
"use strict";
const COLS=40,ROWS=23,TILE=32,BASE="../../res/pic/base/background/";
const TILES=[{id:"empty",code:".",name:"空白",image:null,color:"#090e14"},{id:"floor",code:"B",name:"基岩地板",image:"minecraft_bedrock.png"},{id:"wall",code:"W",name:"木墙",image:"minecraft_wood.png"},{id:"door",code:"D",name:"门（1×2）",image:"background_door_normal.png",height:2},{id:"corner",code:"C",name:"角落",image:"background_corner_wood.png"}];
const ROT=["C","X","Y","Z"];let brush="W",zoom=1,map=[],history=[],images={};const canvas=document.getElementById("map"),ctx=canvas.getContext("2d"),preview=document.getElementById("preview"),pctx=preview.getContext("2d");
const tileByCode=c=>ROT.includes(c)?TILES.find(t=>t.code==="C"):TILES.find(t=>t.code===c)||TILES[0];function resetMap(){map=Array.from({length:ROWS},()=>Array(COLS).fill("."))}function snapshot(){history.push(map.map(r=>r.slice()));if(history.length>40)history.shift()}function saveLocal(){localStorage.setItem("debug_room_map",JSON.stringify(map))}function restoreLocal(){try{const v=JSON.parse(localStorage.getItem("debug_room_map"));if(Array.isArray(v)&&v.length===ROWS){map=v.map(r=>r.slice(0,COLS));map.forEach(r=>{while(r.length<COLS)r.push(".")});return true}}catch(e){}return false}
function loadImages(){return Promise.all(TILES.filter(t=>t.image).map(t=>new Promise(done=>{const im=new Image();im.onload=()=>{images[t.id]=im;done()};im.onerror=()=>done();im.src=BASE+t.image})))}
function buildPalette(){const box=document.getElementById("palette");box.innerHTML="";TILES.forEach(t=>{const el=document.createElement("div");el.className="tile"+(brush===t.code?" selected":"");el.title=t.name+" ["+t.code+"]";el.onclick=()=>{brush=t.code;renderUI()};const code=document.createElement("span");code.className="code";code.textContent=t.code;el.append(code);if(t.image){const im=document.createElement("img");im.src=BASE+t.image;el.append(im)}else{const sw=document.createElement("span");sw.style.cssText="display:block;width:42px;height:42px;background:"+t.color;el.append(sw)}const name=document.createElement("span");name.className="name";name.textContent=t.name;el.append(name);box.append(el)})}
function drawImage(target,im,x,y,w,h,code){target.save();target.translate(x+w/2,y+h/2);if(code==="X"||code==="Z")target.scale(-1,1);if(code==="Y"||code==="Z")target.scale(1,-1);target.imageSmoothingEnabled=false;target.drawImage(im,-w/2,-h/2,w,h);target.restore()}
function paintCell(code,x,y){const t=tileByCode(code),px=x*TILE,py=y*TILE,h=(t.height||1)*TILE;ctx.fillStyle=t.color||"#172535";ctx.fillRect(px,py,TILE,h);if(images[t.id])drawImage(ctx,images[t.id],px,py,TILE,h,code)}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(map[y][x]!==".")paintCell(map[y][x],x,y);ctx.strokeStyle="rgba(210,230,250,.11)";ctx.lineWidth=1;for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*TILE+.5,0);ctx.lineTo(x*TILE+.5,ROWS*TILE);ctx.stroke()}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*TILE+.5);ctx.lineTo(COLS*TILE,y*TILE+.5);ctx.stroke()}ctx.strokeStyle="rgba(90,170,255,.22)";for(let x=0;x<=COLS;x+=4){ctx.beginPath();ctx.moveTo(x*TILE+.5,0);ctx.lineTo(x*TILE+.5,ROWS*TILE);ctx.stroke()}for(let y=0;y<=ROWS;y+=4){ctx.beginPath();ctx.moveTo(0,y*TILE+.5);ctx.lineTo(COLS*TILE,y*TILE+.5);ctx.stroke()}updateInfo()}
function drawPreview(){pctx.clearRect(0,0,96,96);pctx.fillStyle="#0b121b";pctx.fillRect(0,0,96,96);const t=tileByCode(brush);if(images[t.id])drawImage(pctx,images[t.id],16,16,64,(t.height||1)*32,brush);else{pctx.fillStyle=t.color;pctx.fillRect(16,16,64,64)}document.getElementById("previewText").textContent=t.name+"\n字符："+brush+(ROT.includes(brush)?"\n方向："+(ROT.indexOf(brush)+1)+" / 4":"")}
function updateInfo(){document.getElementById("zoomReadout").textContent=Math.round(zoom*100)+"%";const counts={};map.flat().forEach(c=>counts[c]=(counts[c]||0)+1);document.getElementById("counts").innerHTML=[".","B","W","D","C","X","Y","Z"].map(c=>`<div class="count"><span>${c} · ${tileByCode(c).name}</span><b>${counts[c]||0}</b></div>`).join("");document.getElementById("mapText").value=map.map(r=>r.join("")).join("\n");drawPreview()}
function renderUI(){buildPalette();draw()}function point(e){const r=canvas.getBoundingClientRect(),scale=r.width/canvas.width;return{x:Math.floor((e.clientX-r.left)/scale/TILE),y:Math.floor((e.clientY-r.top)/scale/TILE)}}function put(x,y,c){if(x<0||y<0||x>=COLS||y>=ROWS)return;if(c==="D"&&y>=ROWS-1)return;if(map[y][x]===c)return;if(y>0&&map[y-1][x]==="D")map[y-1][x]=".";map[y][x]=c;if(c==="D")map[y+1][x]=".";draw();saveLocal()}
let drawing=false,erase=false;canvas.oncontextmenu=e=>e.preventDefault();canvas.onmousedown=e=>{e.preventDefault();snapshot();drawing=true;erase=e.button===2;const p=point(e);put(p.x,p.y,erase?".":brush)};canvas.onmousemove=e=>{if(drawing){const p=point(e);put(p.x,p.y,erase?".":brush)}};window.onmouseup=()=>drawing=false;
function setZoom(v){zoom=Math.max(.35,Math.min(2.5,v));canvas.style.width=COLS*TILE*zoom+"px";canvas.style.height=720*zoom+"px";const slider=document.querySelector('header input[type="range"]');if(slider)slider.value=String(Math.round(zoom*100));updateInfo()}function zoomFit(){const b=document.getElementById("canvasWrap");setZoom(Math.min((b.clientWidth-48)/(COLS*TILE),(b.clientHeight-48)/720))}function cycle(){brush=ROT.includes(brush)?ROT[(ROT.indexOf(brush)+1)%4]:"C";renderUI()}function newMap(){snapshot();resetMap();renderUI();saveLocal()}function undo(){if(history.length){map=history.pop();renderUI();saveLocal()}}
window.onkeydown=e=>{if(e.ctrlKey&&e.key.toLowerCase()==="z"){e.preventDefault();undo();return}const k=e.key.toLowerCase();if(k==="r")cycle();else if(k==="b")brush="B";else if(k==="w")brush="W";else if(k==="d")brush="D";else if(k==="e")brush=".";else if("1234".includes(e.key))brush=ROT[+e.key-1];else if(k==="0")zoomFit();else if(k==="+")setZoom(zoom+.25);else if(k==="-")setZoom(zoom-.25);else return;renderUI()};
const text=()=>map.map(r=>r.join("")).join("\n"),fileName=()=>document.getElementById("fileName").value.trim()||"room_map.txt";function status(s,ok=true){const e=document.getElementById("status");e.textContent=s;e.className="status "+(ok?"ok":"err")}
async function saveOutput(){try{const r=await fetch("/api/save?name="+encodeURIComponent(fileName()),{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:text()});const j=await r.json();status("已保存：output/"+j.file)}catch(e){status("保存失败，请用 serve.py 启动页面。",false)}}async function loadOutput(){try{const r=await fetch("/api/load?name="+encodeURIComponent(fileName()));if(!r.ok)throw Error();document.getElementById("importText").value=await r.text();importMap();status("已读取：output/"+fileName())}catch(e){status("读取失败：文件不存在或页面未通过 serve.py 打开。",false)}}async function listOutput(){try{const j=await(await fetch("/api/list")).json();status(j.files.length?"已有地图："+j.files.join("、"):"output 目录为空")}catch(e){status("无法列出 output，请用 serve.py 启动页面。",false)}}
function importMap(){const lines=document.getElementById("importText").value.replace(/\r/g,"").split("\n").filter(Boolean);if(!lines.length)return;snapshot();resetMap();const allowed=".BWD CXYZ".replace(/ /g,"");for(let y=0;y<Math.min(ROWS,lines.length);y++)for(let x=0;x<Math.min(COLS,lines[y].length);x++)if(allowed.includes(lines[y][x]))map[y][x]=lines[y][x];renderUI();saveLocal();status("已导入文本地图")}function copyMap(){navigator.clipboard?navigator.clipboard.writeText(text()).then(()=>status("已复制地图文本")):status("浏览器不支持自动复制，请手动复制文本框",false)}function downloadMap(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text()],{type:"text/plain;charset=utf-8"}));a.download=fileName();a.click()}
resetMap();restoreLocal();buildPalette();loadImages().then(renderUI);setZoom(1);window.addEventListener("resize",()=>{if(zoom<.6)zoomFit()});
const rotationSection=document.createElement("div");rotationSection.className="section";rotationSection.innerHTML="<h2>角落方向</h2><div id=\"rotations\" class=\"palette\"></div>";const paletteSection=document.getElementById("palette").parentElement;paletteSection.after(rotationSection);const rotationBox=document.getElementById("rotations");ROT.forEach((code,index)=>{const b=document.createElement("button");b.textContent=code+" 方向 "+(index+1);b.style.cssText="min-height:42px;padding:4px;";b.onclick=()=>{brush=code;renderUI()};rotationBox.append(b)});
const canvasWrap=document.getElementById("canvasWrap");canvasWrap.addEventListener("wheel",e=>{e.preventDefault();setZoom(zoom*(e.deltaY<0?1.1:1/1.1))},{passive:false});const zoomSlider=document.createElement("input");zoomSlider.type="range";zoomSlider.min="35";zoomSlider.max="250";zoomSlider.value="100";zoomSlider.step="1";zoomSlider.title="拖动调整画布缩放";zoomSlider.style.cssText="width:120px;accent-color:#59a9ff";zoomSlider.oninput=()=>setZoom(Number(zoomSlider.value)/100);document.querySelector("header").insertBefore(zoomSlider,document.getElementById("zoomReadout"));
var rotationGrid=[],brushAngle=0;
function resetMap(){map=Array.from({length:ROWS},()=>Array(COLS).fill("."));rotationGrid=Array.from({length:ROWS},()=>Array(COLS).fill(0))}
function snapshot(){history.push({map:map.map(r=>r.slice()),rot:rotationGrid.map(r=>r.slice())});if(history.length>40)history.shift()}
function saveLocal(){localStorage.setItem("debug_room_map",JSON.stringify({map:map,rot:rotationGrid}))}
function restoreLocal(){try{const saved=JSON.parse(localStorage.getItem("debug_room_map"));const old=Array.isArray(saved)?{map:saved,rot:null}:saved;if(!old||!Array.isArray(old.map)||old.map.length!==ROWS)return false;map=old.map.map(r=>r.slice(0,COLS));map.forEach(r=>{while(r.length<COLS)r.push(".")});rotationGrid=old.rot&&old.rot.length===ROWS?old.rot.map(r=>r.slice(0,COLS)):Array.from({length:ROWS},()=>Array(COLS).fill(0));rotationGrid.forEach(r=>{while(r.length<COLS)r.push(0)});return true}catch(e){return false}}
function drawImage(target,im,x,y,w,h,code,angle){target.save();target.translate(x+w/2,y+h/2);if(angle)target.rotate(angle*Math.PI/2);if(code==="X"||code==="Z")target.scale(-1,1);if(code==="Y"||code==="Z")target.scale(1,-1);target.imageSmoothingEnabled=false;const sourceW=angle%2?h:w,sourceH=angle%2?w:h;target.drawImage(im,-sourceW/2,-sourceH/2,sourceW,sourceH);target.restore()}
function paintCell(code,x,y){const t=tileByCode(code),px=x*TILE,py=y*TILE,h=(t.height||1)*TILE,angle=ROT.includes(code)?0:(rotationGrid[y]&&rotationGrid[y][x]||0),outW=angle%2?h:TILE,outH=angle%2?TILE:h;ctx.fillStyle=t.color||"#172535";ctx.fillRect(px,py,outW,outH);if(images[t.id])drawImage(ctx,images[t.id],px,py,outW,outH,code,angle)}
function drawPreview(){pctx.clearRect(0,0,96,96);pctx.fillStyle="#0b121b";pctx.fillRect(0,0,96,96);const t=tileByCode(brush);if(images[t.id])drawImage(pctx,images[t.id],16,16,64,(t.height||1)*32,brush,ROT.includes(brush)?0:brushAngle);else{pctx.fillStyle=t.color;pctx.fillRect(16,16,64,64)}document.getElementById("previewText").textContent=t.name+"\n字符："+brush+(ROT.includes(brush)?"\n角落方向："+(ROT.indexOf(brush)+1)+" / 4":"\n旋转："+(brushAngle*90)+"°")}
function put(x,y,c){if(x<0||y<0||x>=COLS||y>=ROWS)return;if(c==="D"&&((brushAngle%2&&x>=COLS-1)||(!brushAngle%2&&y>=ROWS-1)))return;if(map[y][x]===c&&(!rotationGrid[y]||rotationGrid[y][x]===brushAngle))return;if(y>0&&map[y-1][x]==="D")map[y-1][x]=".";map[y][x]=c;if(c==="D"){if(brushAngle%2)map[y][x+1]=".";else map[y+1][x]="."}rotationGrid[y][x]=ROT.includes(c)?0:brushAngle;draw();saveLocal()}
function cycle(){if(ROT.includes(brush))brush=ROT[(ROT.indexOf(brush)+1)%4];else brushAngle=(brushAngle+1)%4;renderUI()}
function undo(){if(history.length){const last=history.pop();map=last.map||last;rotationGrid=last.rot||Array.from({length:ROWS},()=>Array(COLS).fill(0));renderUI();saveLocal()}}
resetMap();restoreLocal();renderUI();
function parseMapSource(raw){const lines=String(raw||"").replace(/^\uFEFF/,"").replace(/\r/g,"").split("\n").map(line=>line.trim()).filter(line=>line&&line!=="```"&&!/^#/.test(line)&&!/^MAP(?:\s|:)/i.test(line));const allowed=".BWDCXYZ";const parsed=[];for(const line of lines){const compact=line.replace(/\s+/g,"");if(!compact)continue;const row=Array.from({length:COLS},(_,x)=>allowed.includes(compact[x])?compact[x]:".");parsed.push(row)}return parsed.slice(0,ROWS)}
function importMap(){const parsed=parseMapSource(document.getElementById("importText").value);if(!parsed.length){status("没有找到有效的地图行。",false);return}snapshot();resetMap();parsed.forEach((row,y)=>row.forEach((cell,x)=>{map[y][x]=cell}));renderUI();saveLocal();status("已导入 "+parsed.length+" 行地图")}
const filePicker=document.createElement("input");filePicker.type="file";filePicker.accept=".txt,text/plain";filePicker.style.cssText="width:100%;margin-top:7px;color:#91a1b5";filePicker.title="选择地图文本文件";filePicker.addEventListener("change",async()=>{const file=filePicker.files&&filePicker.files[0];if(!file)return;try{document.getElementById("importText").value=await file.text();importMap()}catch(e){status("无法读取文件："+e.message,false)}});document.getElementById("importText").before(filePicker);
function serializeMap(){return "# DEBUG_ROOM_MAP v2\n"+map.map(r=>r.join("")).join("\n")+"\n# ROTATION\n"+rotationGrid.map(r=>r.map(v=>String(v||0)).join("")).join("\n")}
function parseMapSource(raw){const source=String(raw||"").replace(/^\uFEFF/,"").replace(/\r/g,"");const lines=source.split("\n");const marker=lines.findIndex(line=>line.trim().toUpperCase()==="# ROTATION");const mapLines=lines.slice(0,marker>=0?marker:undefined).map(line=>line.trim()).filter(line=>line&&line!=="```"&&!/^#/.test(line)&&!/^MAP(?:\s|:)/i.test(line));const allowed=".BWDCXYZ";const parsed=Array.from({length:ROWS},()=>Array(COLS).fill("."));mapLines.slice(0,ROWS).forEach((line,y)=>{const compact=line.replace(/\s+/g,"");for(let x=0;x<Math.min(COLS,compact.length);x++)if(allowed.includes(compact[x]))parsed[y][x]=compact[x]});const rot=Array.from({length:ROWS},()=>Array(COLS).fill(0));if(marker>=0)lines.slice(marker+1,marker+1+ROWS).forEach((line,y)=>{const compact=line.replace(/\s+/g,"");for(let x=0;x<Math.min(COLS,compact.length);x++){const n=Number(compact[x]);if(n>=0&&n<=3)rot[y][x]=n}});return{map:parsed,rot}}
function updateInfo(){document.getElementById("zoomReadout").textContent=Math.round(zoom*100)+"%";const counts={};map.flat().forEach(c=>counts[c]=(counts[c]||0)+1);document.getElementById("counts").innerHTML=[".","B","W","D","C","X","Y","Z"].map(c=>`<div class="count"><span>${c} · ${tileByCode(c).name}</span><b>${counts[c]||0}</b></div>`).join("");document.getElementById("mapText").value=serializeMap();drawPreview()}
function importMap(){const raw=document.getElementById("importText").value;if(!raw.trim()){status("没有找到有效的地图行。",false);return}const parsed=parseMapSource(raw);snapshot();map=parsed.map;rotationGrid=parsed.rot;renderUI();saveLocal();status("已导入地图和旋转信息")}
async function saveOutput(){try{const r=await fetch("/api/save?name="+encodeURIComponent(fileName()),{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:serializeMap()});const j=await r.json();status("已保存地图和旋转信息：output/"+j.file)}catch(e){status("保存失败，请用 serve.py 启动页面。",false)}}
function copyMap(){const value=serializeMap();if(navigator.clipboard)navigator.clipboard.writeText(value).then(()=>status("已复制完整地图文件"));else status("浏览器不支持自动复制，请手动复制文本框",false)}
function downloadMap(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([serializeMap()],{type:"text/plain;charset=utf-8"}));a.download=fileName();a.click();URL.revokeObjectURL(a.href)}
</script></body></html>
